name: Debug reopen

on:
  push:
    branches: [debug-reopen-ci]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # The checks of development.md on the pinned spinel, on Linux and on
  # macOS. A failure on one system does not stop the run on the other.
  check:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # test/run.rb compares the output of Fluxpinel with CRuby 4.0.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Install libffi (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libffi-dev

      # The Makefile finds the kegs of Homebrew.
      - name: Install libffi and OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: brew install libffi openssl

      # test/m3/ffi_gem.rb compares with the ffi gem under CRuby.
      - name: Install the ffi gem
        run: gem install ffi --no-document

      # --irb runs the irb, reline, rdoc and prism gems of this CRuby
      # (tools/gem_dirs.rb). The irb that CRuby bundles still parses with
      # ripper, which Fluxpinel does not have: the current irb parses with
      # prism, which it loads through its ffi backend (lib/prism/ffi.rb), and
      # that needs the gem's build/libprism.so. The default gem of prism has
      # only the C extension and no lib directory of its own, so install the
      # gems and build the shared library.
      - name: Install the gems of --irb and build prism's shared library
        run: |
          gem install prism irb reline rdoc --no-document
          make -C "$(ruby -e 'puts Gem::Specification.find_by_name("prism").full_gem_path')" shared

      # The build of spinel takes most of the time. The cache keeps it for
      # one pin, so only a change of SPINEL_COMMIT builds spinel again.
      - name: Fetch and build the spinel fix branch
        run: |
          git clone -q --depth 1 -b pr/reopen-failed-keeps-handle https://github.com/amatsuda/spinel.git deps/spinel
          git -C deps/spinel log -1 --format="spinel: %H %s"
          make -C deps/spinel deps
          make -C deps/spinel -j$(nproc)

      - name: Build
        run: make -j$(getconf _NPROCESSORS_ONLN) SPINEL_PIN=0

      - name: The test and the reduced programs under GC stress
        run: |
          set +e
          export SPINEL_GC_STRESS=2 SPINEL_GC_VERIFY=1
          for f in test/m3/io_reopen.rb debug/*.rb; do
            echo "===== $f"
            build/fluxpinel $f
            echo "===== status $?"
          done
          echo "===== plain, no stress, the test"
          env -u SPINEL_GC_STRESS -u SPINEL_GC_VERIFY build/fluxpinel test/m3/io_reopen.rb; echo "===== status $?"
